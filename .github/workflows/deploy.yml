# Publishes the site to GitHub Pages on every push to main.
#
# There is no build step and nothing to install. The site is hand-written HTML,
# one stylesheet and one script, so this workflow copies the files that make up
# the site into _site/ and hands that to Pages.
#
# Copying into a staging directory rather than uploading the repository root is
# deliberate: it keeps README.md, TODO.md and .github out of the published site,
# and it means adding a file to the repo does not silently publish it.

name: Deploy to GitHub Pages

on:
    push:
        branches:
            - main
    # So a redeploy never requires an empty commit.
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deploy.outputs.page_url }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Assemble the site
              run: |
                  mkdir -p _site
                  cp index.html styles.css main.js _site/
                  cp -r assets pdfs _site/
                  cp favicon.ico robots.txt _site/
                  # The custom domain has to be in the published output, not
                  # just in the repo, or Pages drops it on every deploy.
                  if [ -f CNAME ]; then cp CNAME _site/CNAME; fi

            - name: Check nothing is missing
              # A typo in the copy step above would otherwise publish a site
              # with no stylesheet and still report success.
              run: |
                  for f in index.html styles.css main.js favicon.ico CNAME; do
                      test -s "_site/$f" || { echo "missing or empty: $f"; exit 1; }
                  done
                  test -d _site/assets || { echo "missing: assets/"; exit 1; }
                  test -s _site/pdfs/riley-gramlich-resume.pdf || { echo "missing: resume"; exit 1; }
                  echo "published files:"
                  find _site -type f | sort | sed 's/^/  /'

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: _site

            - name: Deploy to GitHub Pages
              id: deploy
              uses: actions/deploy-pages@v4
